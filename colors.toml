# Dead Space — semantic palette for Omarchy.
#
# Omarchy renders every themed config (kitty, ghostty, alacritty, foot, neovim,
# vscode, ...) from this file. Values match the palette already shipped in
# alacritty.toml and kitty.conf.
#
# Selection is the one thing Omarchy cannot infer: without an explicit
# `selection` it falls back to the foreground, and `selection_foreground`
# falls back to the bright foreground, which left selected text white on
# white and unreadable in the terminal.

accent = "#c1baba"

# Highlighted text: dark grey fill, light text. The pairing is deliberate —
# keeping selected text light-on-dark avoids the thinner, washed-out strokes
# terminals produce for dark glyphs over a pale background.
selection = "#3f3f3f"
selection_foreground = "#ffffff"

background = "#010101"
foreground = "#ffffff"

color0 = "#010101"
color1 = "#958a8a"
color2 = "#a49a9a"
color3 = "#b2aaaa"
color4 = "#c1baba"
color5 = "#cfcaca"
color6 = "#dedada"
color7 = "#F6F6F5"
color8 = "#dddbdb"
color9 = "#ada5a5"
color10 = "#bcb5b5"
color11 = "#cac5c5"
color12 = "#d9d5d5"
color13 = "#e7e5e5"
color14 = "#f6f5f5"
color15 = "#ffffff"
